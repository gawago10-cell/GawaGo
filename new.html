<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GawaGo — Household Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .icon { display: inline-block; vertical-align: middle; line-height: 0; }
  .icon svg { display: block; }
  .site { min-height: 100vh; background: #EFEAE0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .topbar { background: #122118; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 20px; font-weight: 800; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: #4CA274; }
  .topbar-right { display: flex; align-items: center; gap: 12px; color: #EFEAE0; font-size: 14px; font-weight: 600; }
  .user-chip { width: 34px; height: 34px; border-radius: 50%; background: #25382C; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
  .main { max-width: 1240px; margin: 0 auto; padding: 28px 32px 70px; }
  .page-title { font-size: 22px; font-weight: 800; color: #1B2A1F; margin: 0 0 22px; }
  .alert-banner { display: flex; align-items: center; justify-content: space-between; border-radius: 14px; padding: 14px 18px; margin-bottom: 22px; cursor: pointer; font-size: 14px; font-weight: 700; transition: filter 0.15s ease; }
  .alert-banner:hover { filter: brightness(0.97); }
  .alert-banner.action { background: linear-gradient(135deg,#5BB084,#3F8E64); color: #fff; }
  .alert-banner.info { background: #D7E6F5; color: #1D4E89; }
  .alert-banner-left { display: flex; align-items: center; gap: 10px; }
  .alert-banner-cta { display: flex; align-items: center; gap: 2px; font-size: 13px; opacity: 0.95; white-space: nowrap; }
  .layout-grid { display: grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 880px) { .layout-grid { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #E6E1D4; border-radius: 18px; }
  .jobs-panel { padding: 18px; }
  .jobs-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .jobs-panel-head h3 { font-size: 15.5px; font-weight: 800; color: #1B2A1F; margin: 0; }
  .post-btn { display: flex; align-items: center; gap: 6px; background: #1B3A2A; color: #fff; border: none; border-radius: 9px; padding: 8px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .job-list-item { padding: 13px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; margin-bottom: 6px; }
  .job-list-item:hover { background: #F6F4ED; }
  .job-list-item.active { background: #EAF4EE; border-color: #BFE0CC; }
  .job-list-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .job-list-top .jt { font-size: 14px; font-weight: 700; color: #16213D; }
  .job-list-bottom { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #8A8473; }
  .job-list-bottom .ac { display: flex; align-items: center; gap: 4px; font-weight: 700; color: #3D5A48; }
  .detail-panel { padding: 26px; min-height: 520px; }
  .empty-detail { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 460px; color: #A39E8F; }
  .empty-detail h4 { color: #6B6657; font-size: 15px; margin: 14px 0 4px; }
  .empty-detail p { font-size: 13px; max-width: 260px; }
  .job-detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .job-detail-top h2 { font-size: 21px; font-weight: 800; color: #16213D; margin: 0; }
  .job-desc { font-size: 14px; color: #4A4636; line-height: 1.6; margin: 12px 0 16px; max-width: 640px; }
  .job-facts { display: flex; gap: 22px; font-size: 13px; color: #6B6657; margin-bottom: 18px; }
  .job-facts span { display: flex; align-items: center; gap: 5px; font-weight: 600; }
  .job-actions { display: flex; gap: 10px; margin-bottom: 22px; }
  .btn { border: none; border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; justify-content: center; }
  .btn-danger { background: #F4D6D2; color: #8C2A22; }
  .btn-primary { background: #3F8E64; color: #fff; }
  .btn-ghost { background: #F1EEE3; color: #3D5A48; }
  .completed-box { background: #F4F8F5; border: 1px solid #D8E6DC; border-radius: 14px; padding: 16px; margin-bottom: 22px; }
  .completed-box-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .completed-box-head strong { font-size: 13.5px; color: #1B3A2A; }
  .review-stars { display: flex; gap: 2px; margin-bottom: 6px; }
  .review-text { font-size: 13.5px; color: #4A4636; line-height: 1.5; }
  .edit-link { background: none; border: none; color: #1D4E89; font-size: 12.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .section-sub { font-size: 15.5px; font-weight: 800; color: #1B2A1F; margin: 0 0 14px; }
  .applicants-table { display: flex; flex-direction: column; gap: 8px; }
  .applicant-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #E6E1D4; border-radius: 14px; cursor: pointer; }
  .applicant-row:hover { background: #F9F7F1; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; }
  .avatar.lg { width: 68px; height: 68px; font-size: 22px; }
  .applicant-info { flex: 1; min-width: 0; }
  .applicant-info .name { font-size: 14.5px; font-weight: 700; color: #16213D; margin-bottom: 3px; }
  .applicant-info .loc { font-size: 12px; color: #8A8473; }
  .starrow { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: #6B6657; font-weight: 600; }
  .pill { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .empty-card { padding: 30px 18px; text-align: center; color: #8A8473; font-size: 14px; border: 1px dashed #E6E1D4; border-radius: 14px; }
  .back-link { display: flex; align-items: center; gap: 4px; background: none; border: none; color: #1B3A2A; font-weight: 700; font-size: 13.5px; cursor: pointer; padding: 0 0 18px; }
  .profile-head { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .profile-head h2 { font-size: 19px; font-weight: 800; color: #16213D; margin: 0 0 5px; }
  .profile-sub { font-size: 12.5px; color: #8A8473; display: flex; align-items: center; gap: 4px; margin-top: 5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0; }
  .tag { background: #EFEAE0; color: #3D5A48; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
  .bio { font-size: 13.5px; color: #4A4636; line-height: 1.6; max-width: 560px; }
  .status-banner { border-radius: 14px; padding: 14px 16px; margin: 18px 0 16px; font-size: 13.5px; font-weight: 700; max-width: 560px; }
  .action-row { display: flex; gap: 10px; max-width: 420px; }
  .action-row .btn { flex: 1; }
  .schedule-panel { background: #F6F4ED; border: 1px solid #E6E1D4; border-radius: 14px; padding: 16px; margin: 16px 0; max-width: 420px; }
  .schedule-panel label { font-size: 12px; font-weight: 700; color: #6B6657; display: block; margin-bottom: 5px; }
  .schedule-panel input { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #DDD7C8; font-size: 13.5px; margin-bottom: 10px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,20,15,0.5); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal-card { background: #EFEAE0; width: 100%; max-width: 440px; border-radius: 20px; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-head h3 { font-size: 17px; font-weight: 800; color: #16213D; margin: 0; }
  .close-btn { background: #fff; border: 1px solid #E6E1D4; border-radius: 10px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 12.5px; font-weight: 700; color: #6B6657; display: block; margin-bottom: 6px; }
  .field select, .field textarea, .field input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #DDD7C8; font-size: 14px; font-family: inherit; background: #fff; }
  .field textarea { resize: vertical; min-height: 80px; }
  .submit-btn { width: 100%; background: #1B3A2A; color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .star-picker { display: flex; gap: 6px; margin-bottom: 14px; }
  .star-pick-btn { background: none; border: none; cursor: pointer; padding: 2px; }
  .modal-worker-chip { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #E6E1D4; border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; }
  .modal-worker-chip .name { font-weight: 700; font-size: 13.5px; color: #16213D; }
  .modal-worker-chip .sub { font-size: 11.5px; color: #8A8473; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="site" id="app">

  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span> GawaGo</div>
    <div class="topbar-right">
      Welcome, Juan Dela Cruz
      <div class="user-chip">JD</div>
    </div>
  </div>

  <div class="main">
    <h1 class="page-title">Household Dashboard</h1>

    <div id="banner-slot"></div>

    <div class="layout-grid">
      <!-- LEFT: jobs list -->
      <div class="panel jobs-panel">
        <div class="jobs-panel-head">
          <h3>Recent Posted Jobs</h3>
          <button class="post-btn" id="open-post-modal">${'' /* placeholder, replaced below */}</button>
        </div>
        <div id="jobs-list"></div>
      </div>

      <!-- RIGHT: detail panel -->
      <div class="panel detail-panel" id="detail-panel"></div>
    </div>
  </div>

  <!-- POST JOB MODAL -->
  <div class="modal-overlay hidden" id="post-modal-overlay">
    <div class="modal-card" id="post-modal-card">
      <div class="modal-head">
        <h3>Post a New Job</h3>
        <button class="close-btn" id="close-post-modal"></button>
      </div>
      <div class="field">
        <label>Job type</label>
        <select id="new-job-type"></select>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="new-job-desc" placeholder="What do you need done?"></textarea>
      </div>
      <div class="field">
        <label>Budget</label>
        <input id="new-job-budget" placeholder="e.g. ₱800" />
      </div>
      <button class="submit-btn" id="submit-post-job">Post Job</button>
    </div>
  </div>

  <!-- RATING MODAL -->
  <div class="modal-overlay hidden" id="rating-modal-overlay">
    <div class="modal-card" id="rating-modal-card">
      <div class="modal-head">
        <h3 id="rating-modal-title">Complete Job &amp; Rate Worker</h3>
        <button class="close-btn" id="close-rating-modal"></button>
      </div>
      <div id="rating-worker-chip"></div>
      <div class="field">
        <label id="rating-question">How was this worker's work?</label>
        <div class="star-picker" id="star-picker"></div>
      </div>
      <div class="field">
        <label>Feedback for this worker (optional)</label>
        <textarea id="feedback-text" placeholder="Share what went well or what could be better..."></textarea>
      </div>
      <button class="submit-btn" id="submit-rating" disabled>Complete Job &amp; Submit Review</button>
    </div>
  </div>

</div>

<script>

  interviewed: { label: "Interview Done", color: "#5B3A8E", bg: "#E6DCF5" },
  hired: { label: "Hired", color: "#FFFFFF", bg: "#4CA274" },
  declined: { label: "Declined", color: "#8C2A22", bg: "#F4D6D2" },
  not_selected: { label: "Not Selected", color: "#6B7280", bg: "#EDEBE3" },
};

const avatarPalette = ["#2F6B4F", "#1D4E89", "#8E5B3A", "#5B3A8E", "#A3471F", "#3A6B6B", "#6B5B2F"];
function initials(name) { return name.split(" ").map((p) => p[0]).join("").slice(0, 2).toUpperCase(); }
function avatarColor(name) {
  let sum = 0;
  for (const c of name) sum += c.charCodeAt(0);
  return avatarPalette[sum % avatarPalette.length];
}
function escapeHtml(str) {
  if (str == null) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ===================== STATE =====================
let state = {
  jobs: JSON.parse(JSON.stringify(seedJobs)),
  activeJobId: "j1",
  activeWorkerId: null,
  showSchedule: false,
  schedDate: "",
  schedTime: "",
  ratingJobId: null,
  ratingValue: 0,
  feedbackText: "",
};

function getActiveJob() { return state.jobs.find(j => j.id === state.activeJobId) || null; }
function getActiveWorker() {
  const job = getActiveJob();
  return job ? job.applicants.find(a => a.id === state.activeWorkerId) : null;
}
function getRatingJob() { return state.jobs.find(j => j.id === state.ratingJobId) || null; }
function getRatingWorker() {
  const job = getRatingJob();
  return job ? job.applicants.find(a => a.status === "hired") : null;
}

// ===================== ACTIONS =====================
function selectJob(id) {
  state.activeJobId = id;
  state.activeWorkerId = null;
  state.showSchedule = false;
  render();
}
function selectWorker(id) {
  state.activeWorkerId = id;
  state.showSchedule = false;
  render();
}
function backToApplicants() {
  state.activeWorkerId = null;
  state.showSchedule = false;
  render();
}
function updateApplicant(jobId, workerId, patch) {
  state.jobs = state.jobs.map(j => {
    if (j.id !== jobId) return j;
    return { ...j, applicants: j.applicants.map(a => a.id === workerId ? { ...a, ...patch } : a) };
  });
}
function setJobStatus(jobId, status) {
  state.jobs = state.jobs.map(j => j.id === jobId ? { ...j, status } : j);
}
function handleHire(jobId, workerId) {
  state.jobs = state.jobs.map(j => {
    if (j.id !== jobId) return j;
    return {
      ...j,
      status: "in_progress",
      applicants: j.applicants.map(a => {
        if (a.id === workerId) return { ...a, status: "hired" };
        if (["pending", "interview_scheduled", "interviewed"].includes(a.status)) return { ...a, status: "not_selected" };
        return a;
      }),
    };
  });
  render();
}
function handleDecline(jobId, workerId) {
  updateApplicant(jobId, workerId, { status: "declined" });
  render();
}
function confirmSchedule(jobId, workerId) {
  if (!state.schedDate || !state.schedTime) return;
  updateApplicant(jobId, workerId, { status: "interview_scheduled", interviewAt: `${state.schedDate} • ${state.schedTime}` });
  state.showSchedule = false;
  state.schedDate = "";
  state.schedTime = "";
  render();
}
function markInterviewDone(jobId, workerId) {
  updateApplicant(jobId, workerId, { status: "interviewed" });
  render();
}
function cancelInterview(jobId, workerId) {
  updateApplicant(jobId, workerId, { status: "pending", interviewAt: undefined });
  render();
}
function postJob() {
  const descEl = document.getElementById("new-job-desc");
  const typeEl = document.getElementById("new-job-type");
  const budgetEl = document.getElementById("new-job-budget");
  const desc = descEl.value.trim();
  if (!desc) return;
  const id = "j" + Date.now();
  state.jobs = [
    { id, type: typeEl.value, description: desc, budget: budgetEl.value.trim() || "Open budget",
      postedDate: "Jun 21, 2026", status: "open", applicants: [] },
    ...state.jobs,
  ];
  descEl.value = "";
  budgetEl.value = "";
  closePostModal();
  render();
}
function openRatingModal(jobId) {
  const job = state.jobs.find(j => j.id === jobId);
  const worker = job ? job.applicants.find(a => a.status === "hired") : null;
  state.ratingJobId = jobId;
  state.ratingValue = (worker && worker.yourRating) || 0;
  state.feedbackText = (worker && worker.yourFeedback) || "";
  renderRatingModal();
  document.getElementById("rating-modal-overlay").classList.remove("hidden");
}
function closeRatingModal() {
  state.ratingJobId = null;
  state.ratingValue = 0;
  state.feedbackText = "";
  document.getElementById("rating-modal-overlay").classList.add("hidden");
}
function submitRating() {
  if (!state.ratingJobId || state.ratingValue === 0) return;
  state.jobs = state.jobs.map(j => {
    if (j.id !== state.ratingJobId) return j;
    return {
      ...j,
      status: "completed",
      applicants: j.applicants.map(a => a.status === "hired" ? { ...a, yourRating: state.ratingValue, yourFeedback: state.feedbackText.trim() } : a),
    };
  });
  closeRatingModal();
  render();
}
function openPostModal() {
  document.getElementById("post-modal-overlay").classList.remove("hidden");
}
function closePostModal() {
  document.getElementById("post-modal-overlay").classList.add("hidden");
}

// ===================== RENDER HELPERS =====================
function pillHtml(label, color, bg) {
  return `<span class="pill" style="color:${color};background:${bg};">${escapeHtml(label)}</span>`;
}
function starRowHtml(rating) {
  return `<span class="starrow">${icon('star', 13, '#D9A441', '#D9A441')}<span>${rating.toFixed(1)}</span></span>`;
}

function renderBanner() {
  const jobs = state.jobs;
  const newApplicantsCount = jobs.reduce((s, j) => s + j.applicants.filter(a => a.status === "pending").length, 0);
  const interviewsScheduledCount = jobs.reduce((s, j) => s + j.applicants.filter(a => a.status === "interview_scheduled").length, 0);

  let html = "";
  let bannerJobId = null, bannerWorkerId = null;

  if (newApplicantsCount > 0) {
    const job = jobs.find(j => j.applicants.some(a => a.status === "pending"));
    const worker = job ? job.applicants.find(a => a.status === "pending") : null;
    bannerJobId = job ? job.id : null;
    bannerWorkerId = worker ? worker.id : null;
    html = `
      <div class="alert-banner action" id="banner-el">
        <span class="alert-banner-left">${icon('bell', 17)} ${newApplicantsCount} new applicant${newApplicantsCount > 1 ? "s" : ""} waiting for your review</span>
        <span class="alert-banner-cta">Review now ${icon('chevronRight', 15)}</span>
      </div>`;
  } else if (interviewsScheduledCount > 0) {
    const job = jobs.find(j => j.applicants.some(a => a.status === "interview_scheduled"));
    const worker = job ? job.applicants.find(a => a.status === "interview_scheduled") : null;
    bannerJobId = job ? job.id : null;
    bannerWorkerId = worker ? worker.id : null;
    html = `
      <div class="alert-banner info" id="banner-el">
        <span class="alert-banner-left">${icon('calendar', 17)} ${interviewsScheduledCount} interview${interviewsScheduledCount > 1 ? "s" : ""} scheduled this week</span>
        <span class="alert-banner-cta">View details ${icon('chevronRight', 15)}</span>
      </div>`;
  }

  document.getElementById("banner-slot").innerHTML = html;
  const el = document.getElementById("banner-el");
  if (el) {
    el.addEventListener("click", () => {
      if (bannerJobId) selectJob(bannerJobId);
      if (bannerWorkerId) selectWorker(bannerWorkerId);
    });
  }
}

function renderJobsList() {
  const container = document.getElementById("jobs-list");
  if (state.jobs.length === 0) {
    container.innerHTML = `<div class="empty-card">No posted jobs yet.</div>`;
    return;
  }
  container.innerHTML = state.jobs.map(j => {
    const meta = jobStatusMeta[j.status];
    const count = j.applicants.length;
    return `
      <div class="job-list-item ${j.id === state.activeJobId ? "active" : ""}" data-job-id="${j.id}">
        <div class="job-list-top">
          <span class="jt">${escapeHtml(j.type)}</span>
          ${pillHtml(meta.label, meta.color, meta.bg)}
        </div>
        <div class="job-list-bottom">
          <span>${escapeHtml(j.postedDate)}</span>
          ${count > 0
            ? `<span class="ac">${icon('users', 12)} ${count} applied</span>`
            : `<span>No applicants</span>`}
        </div>
      </div>`;
  }).join("");

  container.querySelectorAll(".job-list-item").forEach(el => {
    el.addEventListener("click", () => selectJob(el.getAttribute("data-job-id")));
  });
}

function renderDetailPanel() {
  const panel = document.getElementById("detail-panel");
  const activeJob = getActiveJob();
  const activeWorker = getActiveWorker();

  if (!activeJob) {
    panel.innerHTML = `
      <div class="empty-detail">
        ${icon('inbox', 40, 'none', '#C9C3B2')}
        <h4>Select a job to see who's applied</h4>
        <p>Pick a posting from the list on the left to review applicants and manage interviews.</p>
      </div>`;
    return;
  }

  if (activeJob && !activeWorker) {
    const meta = jobStatusMeta[activeJob.status];
    let completedBoxHtml = "";
    if (activeJob.status === "completed") {
      const w = activeJob.applicants.find(a => a.status === "hired");
      if (w) {
        const stars = [1,2,3,4,5].map(n => icon('star', 15, n <= w.yourRating ? '#D9A441' : 'none', '#D9A441')).join("");
        completedBoxHtml = `
          <div class="completed-box">
            <div class="completed-box-head">
              <strong>Job completed — you rated ${escapeHtml(w.name)}</strong>
              <button class="edit-link" id="edit-review-btn">${icon('edit3', 13)} Edit Review</button>
            </div>
            <div class="review-stars">${stars}</div>
            ${w.yourFeedback ? `<div class="review-text">${escapeHtml(w.yourFeedback)}</div>` : ""}
          </div>`;
      }
    }

    let jobActionsHtml = `<div class="job-actions">`;
    if (activeJob.status === "open" || activeJob.status === "in_progress") {
      jobActionsHtml += `<button class="btn btn-danger" id="cancel-job-btn">${icon('ban', 14)} Cancel This Job</button>`;
    }
    if (activeJob.status === "in_progress") {
      jobActionsHtml += `<button class="btn btn-primary" id="complete-job-btn">${icon('check', 14)} Mark Completed &amp; Rate Worker</button>`;
    }
    jobActionsHtml += `</div>`;

    const applicantsHtml = activeJob.applicants.length === 0
      ? `<div class="empty-card">No applications yet. We'll notify you when a worker applies for this job.</div>`
      : `<div class="applicants-table">${activeJob.applicants.map(a => {
          const m = applicantStatusMeta[a.status];
          return `
            <div class="applicant-row" data-worker-id="${a.id}">
              <div class="avatar" style="background:${avatarColor(a.name)};">${initials(a.name)}</div>
              <div class="applicant-info">
                <div class="name">${escapeHtml(a.name)}</div>
                <div class="loc">${starRowHtml(a.rating)}</div>
              </div>
              ${pillHtml(m.label, m.color, m.bg)}
              ${icon('chevronRight', 16, 'none', '#A39E8F')}
            </div>`;
        }).join("")}</div>`;

    panel.innerHTML = `
      <div class="job-detail-top">
        <h2>${escapeHtml(activeJob.type)}</h2>
        ${pillHtml(meta.label, meta.color, meta.bg)}
      </div>
      <p class="job-desc">${escapeHtml(activeJob.description)}</p>
      <div class="job-facts">
        <span>${icon('briefcase', 13)} ${escapeHtml(activeJob.budget)}</span>
        <span>${icon('calendar', 13)} Posted ${escapeHtml(activeJob.postedDate)}</span>
      </div>
      ${completedBoxHtml}
      ${jobActionsHtml}
      <h3 class="section-sub">Applicants (${activeJob.applicants.length})</h3>
      ${applicantsHtml}
    `;

    const cancelBtn = document.getElementById("cancel-job-btn");
    if (cancelBtn) cancelBtn.addEventListener("click", () => { setJobStatus(activeJob.id, "cancelled"); render(); });
    const completeBtn = document.getElementById("complete-job-btn");
    if (completeBtn) completeBtn.addEventListener("click", () => openRatingModal(activeJob.id));
    const editBtn = document.getElementById("edit-review-btn");
    if (editBtn) editBtn.addEventListener("click", () => openRatingModal(activeJob.id));
    panel.querySelectorAll(".applicant-row").forEach(el => {
      el.addEventListener("click", () => selectWorker(el.getAttribute("data-worker-id")));
    });
    return;
  }

  if (activeJob && activeWorker) {
    let statusBannerHtml = "";
    if (activeWorker.status === "pending") {
      statusBannerHtml = `<div class="status-banner" style="background:#FBE8C6;color:#92660E;">This worker applied and is waiting for your review.</div>`;
    } else if (activeWorker.status === "interview_scheduled") {
      statusBannerHtml = `<div class="status-banner" style="background:#D7E6F5;color:#1D4E89;">${icon('clock', 14)} <span style="margin-left:6px;">Interview scheduled — ${escapeHtml(activeWorker.interviewAt)}</span></div>`;
    } else if (activeWorker.status === "interviewed") {
      statusBannerHtml = `<div class="status-banner" style="background:#E6DCF5;color:#5B3A8E;">Interview completed. Ready to make a decision.</div>`;
    } else if (activeWorker.status === "hired" && activeJob.status === "in_progress") {
      statusBannerHtml = `<div class="status-banner" style="background:#4CA274;color:#fff;">${icon('sparkles', 14)} <span style="margin-left:6px;">Hired and currently working on this job.</span></div>`;
    } else if (activeWorker.status === "hired" && activeJob.status === "completed") {
      statusBannerHtml = `<div class="status-banner" style="background:#F4F8F5;color:#1B3A2A;border:1px solid #D8E6DC;">${icon('messageSquare', 14)} <span style="margin-left:6px;">Job completed. You rated this worker ${activeWorker.yourRating}★.</span></div>`;
    } else if (activeWorker.status === "declined") {
      statusBannerHtml = `<div class="status-banner" style="background:#F4D6D2;color:#8C2A22;">You declined this applicant.</div>`;
    } else if (activeWorker.status === "not_selected") {
      statusBannerHtml = `<div class="status-banner" style="background:#EDEBE3;color:#6B7280;">Another worker was hired for this job.</div>`;
    }

    let schedulePanelHtml = "";
    if (state.showSchedule) {
      schedulePanelHtml = `
        <div class="schedule-panel">
          <label>Interview date</label>
          <input type="date" id="sched-date-input" value="${escapeHtml(state.schedDate)}" />
          <label>Interview time</label>
          <input type="time" id="sched-time-input" value="${escapeHtml(state.schedTime)}" />
          <div class="action-row">
            <button class="btn btn-danger" id="cancel-schedule-btn">Cancel</button>
            <button class="btn btn-primary" id="confirm-schedule-btn">Confirm</button>
          </div>
        </div>`;
    }

    let actionRowHtml = "";
    if (!state.showSchedule && activeWorker.status === "pending") {
      actionRowHtml = `
        <div class="action-row">
          <button class="btn btn-danger" id="decline-btn">${icon('x', 14)} Decline</button>
          <button class="btn btn-primary" id="schedule-btn">${icon('calendar', 14)} Schedule Interview</button>
        </div>`;
    } else if (!state.showSchedule && activeWorker.status === "interview_scheduled") {
      actionRowHtml = `
        <div class="action-row">
          <button class="btn btn-danger" id="cancel-interview-btn">${icon('ban', 14)} Cancel Interview</button>
          <button class="btn btn-primary" id="mark-interview-done-btn">${icon('check', 14)} Mark Interview Done</button>
        </div>`;
    } else if (!state.showSchedule && activeWorker.status === "interviewed") {
      actionRowHtml = `
        <div class="action-row">
          <button class="btn btn-danger" id="decline-btn">${icon('x', 14)} Decline</button>
          <button class="btn btn-primary" id="hire-btn">${icon('sparkles', 14)} Hire This Worker</button>
        </div>`;
    } else if (!state.showSchedule && activeWorker.status === "hired" && activeJob.status === "in_progress") {
      actionRowHtml = `
        <div class="action-row">
          <button class="btn btn-primary" id="complete-job-btn2">${icon('check', 14)} Mark Job Completed &amp; Rate</button>
        </div>`;
    } else if (!state.showSchedule && activeWorker.status === "hired" && activeJob.status === "completed") {
      actionRowHtml = `
        <div class="action-row">
          <button class="btn btn-ghost" id="edit-review-btn2">${icon('edit3', 14)} Edit Your Review</button>
        </div>`;
    }

    panel.innerHTML = `
      <button class="back-link" id="back-to-applicants-btn">${icon('chevronLeft', 16)} Back to Applicants</button>
      <div class="profile-head">
        <div class="avatar lg" style="background:${avatarColor(activeWorker.name)};">${initials(activeWorker.name)}</div>
        <div>
          <h2>${escapeHtml(activeWorker.name)}</h2>
          ${starRowHtml(activeWorker.rating)}
          <div class="profile-sub">${icon('mapPin', 12)} ${escapeHtml(activeWorker.location)} • ${escapeHtml(activeWorker.experience)} experience</div>
        </div>
      </div>
      <div class="tags">${activeWorker.skills.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join("")}</div>
      <p class="bio">${escapeHtml(activeWorker.bio)}</p>
      ${statusBannerHtml}
      ${schedulePanelHtml}
      ${actionRowHtml}
    `;

    document.getElementById("back-to-applicants-btn").addEventListener("click", backToApplicants);

    const declineBtn = document.getElementById("decline-btn");
    if (declineBtn) declineBtn.addEventListener("click", () => handleDecline(activeJob.id, activeWorker.id));

    const scheduleBtn = document.getElementById("schedule-btn");
    if (scheduleBtn) scheduleBtn.addEventListener("click", () => { state.showSchedule = true; render(); });

    const cancelScheduleBtn = document.getElementById("cancel-schedule-btn");
    if (cancelScheduleBtn) cancelScheduleBtn.addEventListener("click", () => { state.showSchedule = false; render(); });

    const confirmScheduleBtn = document.getElementById("confirm-schedule-btn");
    if (confirmScheduleBtn) confirmScheduleBtn.addEventListener("click", () => {
      state.schedDate = document.getElementById("sched-date-input").value;
      state.schedTime = document.getElementById("sched-time-input").value;
      confirmSchedule(activeJob.id, activeWorker.id);
    });

    const cancelInterviewBtn = document.getElementById("cancel-interview-btn");
    if (cancelInterviewBtn) cancelInterviewBtn.addEventListener("click", () => cancelInterview(activeJob.id, activeWorker.id));

    const markInterviewDoneBtn = document.getElementById("mark-interview-done-btn");
    if (markInterviewDoneBtn) markInterviewDoneBtn.addEventListener("click", () => markInterviewDone(activeJob.id, activeWorker.id));

    const hireBtn = document.getElementById("hire-btn");
    if (hireBtn) hireBtn.addEventListener("click", () => handleHire(activeJob.id, activeWorker.id));

    const completeJobBtn2 = document.getElementById("complete-job-btn2");
    if (completeJobBtn2) completeJobBtn2.addEventListener("click", () => openRatingModal(activeJob.id));

    const editReviewBtn2 = document.getElementById("edit-review-btn2");
    if (editReviewBtn2) editReviewBtn2.addEventListener("click", () => openRatingModal(activeJob.id));
  }
}

function renderRatingModal() {
  const ratingJob = getRatingJob();
  const ratingWorker = getRatingWorker();

  document.getElementById("rating-modal-title").textContent =
    ratingJob && ratingJob.status === "completed" ? "Edit Your Review" : "Complete Job & Rate Worker";

  const chipContainer = document.getElementById("rating-worker-chip");
  if (ratingWorker) {
    chipContainer.innerHTML = `
      <div class="modal-worker-chip">
        <div class="avatar" style="background:${avatarColor(ratingWorker.name)};">${initials(ratingWorker.name)}</div>
        <div>
          <div class="name">${escapeHtml(ratingWorker.name)}</div>
          <div class="sub">${escapeHtml(ratingJob.type)}</div>
        </div>
      </div>`;
  } else {
    chipContainer.innerHTML = "";
  }

  document.getElementById("rating-question").textContent =
    `How was ${ratingWorker ? ratingWorker.name.split(" ")[0] : "this worker"}'s work?`;

  renderStarPicker();

  document.getElementById("feedback-text").value = state.feedbackText;

  const submitBtn = document.getElementById("submit-rating");
  submitBtn.disabled = state.ratingValue === 0;
  submitBtn.textContent = ratingJob && ratingJob.status === "completed" ? "Save Review" : "Complete Job & Submit Review";
}

function renderStarPicker() {
  const container = document.getElementById("star-picker");
  container.innerHTML = [1,2,3,4,5].map(n => `
    <button type="button" class="star-pick-btn" data-star="${n}" aria-label="${n} star">
      ${icon('star', 30, n <= state.ratingValue ? '#D9A441' : 'none', '#D9A441')}
    </button>`).join("");
  container.querySelectorAll(".star-pick-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.ratingValue = parseInt(btn.getAttribute("data-star"), 10);
      renderStarPicker();
      document.getElementById("submit-rating").disabled = state.ratingValue === 0;
    });
  });
}

function render() {
  renderBanner();
  renderJobsList();
  renderDetailPanel();
}

// ===================== STATIC SETUP =====================
function setupStaticUI() {
  // post button icon + label
  document.getElementById("open-post-modal").innerHTML = `${icon('plus', 14)} Post a Job`;
  document.getElementById("open-post-modal").addEventListener("click", openPostModal);

  // close icons
  document.getElementById("close-post-modal").innerHTML = icon('x', 16);
  document.getElementById("close-post-modal").addEventListener("click", closePostModal);
  document.getElementById("close-rating-modal").innerHTML = icon('x', 16);
  document.getElementById("close-rating-modal").addEventListener("click", closeRatingModal);

  // overlay click-to-close
  document.getElementById("post-modal-overlay").addEventListener("click", (e) => {
    if (e.target.id === "post-modal-overlay") closePostModal();
  });
  document.getElementById("rating-modal-overlay").addEventListener("click", (e) => {
    if (e.target.id === "rating-modal-overlay") closeRatingModal();
  });
  document.getElementById("post-modal-card").addEventListener("click", (e) => e.stopPropagation());
  document.getElementById("rating-modal-card").addEventListener("click", (e) => e.stopPropagation());

  // job type select options
  const typeSelect = document.getElementById("new-job-type");
  typeSelect.innerHTML = JOB_TYPES.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");

  // post job submit
  document.getElementById("submit-post-job").addEventListener("click", postJob);

  // rating submit + feedback input
  document.getElementById("submit-rating").addEventListener("click", submitRating);
  document.getElementById("feedback-text").addEventListener("input", (e) => {
    state.feedbackText = e.target.value;
  });
}

// ===================== INIT =====================
setupStaticUI();
render();
</script>
