<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GawaGo — Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar: #1A2415;
    --accent: #9EBF5E;
    --cream: #F5F1E6;
    --muted: #C2CBAF;
    --on-accent: #1B2412;
    --bg: #E4D8B8;
    --text: #1F2A19;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; }

  /* ---------- Landing screen revealed after the intro ---------- */
  .landing {
    position: fixed; inset: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 18px;
  }
  .landing h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(32px, 5vw, 56px); line-height: 1.1; max-width: 760px; }
  .landing h1 span { color: #5C7A34; }
  .landing p { margin: 0; color: #6B7460; max-width: 520px; font-size: 17px; line-height: 1.6; }
  .landing .row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .btn { display: inline-flex; align-items: center; padding: 14px 26px; border-radius: 12px; font-weight: 700; font-size: 15px; border: none; cursor: pointer; font-family: inherit; }
  .btn-solid { background: var(--accent); color: var(--on-accent); }
  .btn-ghost { background: transparent; border: 1.5px solid rgba(31,42,25,0.25); color: var(--text); }

  /* ---------- Intro overlay ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 20; background: var(--sidebar);
    overflow: hidden; cursor: pointer;
    transition: opacity .7s ease, visibility .7s ease;
  }
  .intro.leave { opacity: 0; visibility: hidden; pointer-events: none; }
  canvas { position: absolute; inset: 0; display: block; z-index: 1; }

  .center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    pointer-events: none; width: 100%; padding: 0 16px;
  }

  /* house */
  .house-wrap { width: min(220px, 52vw); aspect-ratio: 1 / 1; }
  .house-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .house { stroke: var(--cream); stroke-width: 3.4; }
  .ground { stroke: rgba(245,241,230,0.35); stroke-width: 2; }
  .intro.house-on .roof   { animation: draw .55s cubic-bezier(.6,.1,.2,1) .05s forwards; }
  .intro.house-on .body   { animation: draw .65s cubic-bezier(.6,.1,.2,1) .25s forwards; }
  .intro.house-on .ground { animation: draw .5s ease forwards; }
  .intro.house-on .doorf  { animation: draw .4s ease .55s forwards; }

  .door-fill { fill: var(--accent); opacity: 0; transform-box: fill-box; transform-origin: bottom center; transform: scaleY(.15); }
  .intro.door-on .door-fill { animation: doorOpen .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
  .house-glow { opacity: 0; filter: blur(16px); fill: var(--accent); }
  .intro.door-on .house-glow { animation: glowPulse 1.2s ease forwards; }
  .window { fill: var(--accent); opacity: 0; }
  .intro.door-on .window { animation: winOn .4s ease .3s forwards; }

  .wordmark { margin-top: 6px; display: flex; align-items: flex-end; font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: clamp(46px, 9vw, 84px); letter-spacing: -0.02em; line-height: 1; color: var(--cream); }
  .wordmark .ch { display: inline-block; opacity: 0; transform: translateY(30%) scale(.85); filter: blur(8px); }
  .wordmark .go { color: var(--accent); }
  .intro.reveal .wordmark .ch { animation: letterIn .7s cubic-bezier(.2,.9,.3,1.1) forwards; animation-delay: calc(var(--d) * 90ms); }

  .tagline { margin-top: 18px; font-size: clamp(14px, 2.2vw, 18px); color: var(--muted); letter-spacing: .02em; opacity: 0; transform: translateY(8px); }
  .tagline b { color: var(--accent); font-weight: 600; }
  .intro.reveal .tagline { animation: fadeUp .7s ease .7s forwards; }

  .cta { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; transform: translateY(8px); }
  .intro.done .cta { animation: fadeUp .6s ease forwards; pointer-events: auto; }
  .cta .start { background: var(--accent); color: var(--on-accent); border: none; padding: 15px 34px; border-radius: 12px; font-weight: 700; font-size: 15.5px; font-family: inherit; cursor: pointer; }
  .cta .replay { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: underline; text-underline-offset: 3px; }

  .legend { position: absolute; z-index: 2; top: 26px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: rgba(194,203,175,.75); opacity: 0; transition: opacity .6s ease; white-space: nowrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
  .intro.show-legend .legend { opacity: 1; }
  .intro.house-on .legend { opacity: 0; }

  .skip { position: absolute; z-index: 2; bottom: 26px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: rgba(194,203,175,.6); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .intro.done .skip { display: none; }

  .intro.fast *, .intro.fast .ch { animation-duration: .01s !important; animation-delay: 0s !important; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes doorOpen { to { opacity: 1; transform: scaleY(1); } }
  @keyframes glowPulse { 0% { opacity: 0; } 40% { opacity: .55; } 100% { opacity: .25; } }
  @keyframes winOn { to { opacity: .85; } }
  @keyframes letterIn { to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- screen shown after the intro -->
<div class="landing">
  <h1>Find <span>trusted</span> helpers and skilled workers near you.</h1>
  <p>GawaGo connects households and workers with smart matching, transparent rates, and a fair reputation system.</p>
  <div class="row">
    <button class="btn btn-solid">Post a Job</button>
    <button class="btn btn-ghost">Find Work</button>
  </div>
</div>

<!-- the intro -->
<div class="intro" id="intro">
  <canvas id="cv"></canvas>

  <div class="legend">
    <span><i style="background:#F5F1E6"></i>Households</span>
    <span><i style="background:#9EBF5E"></i>Workers</span>
  </div>

  <div class="center">
    <div class="house-wrap">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <ellipse class="house-glow" cx="100" cy="120" rx="62" ry="54"></ellipse>
        <path class="draw ground" pathLength="1" d="M20 170 H180"></path>
        <path class="draw house roof" pathLength="1" d="M34 96 L100 38 L166 96"></path>
        <path class="draw house body" pathLength="1" d="M52 82 V170 H148 V82"></path>
        <rect class="window" x="66" y="104" width="18" height="18" rx="3"></rect>
        <rect class="window" x="116" y="104" width="18" height="18" rx="3"></rect>
        <rect class="door-fill" x="86" y="126" width="28" height="44" rx="3"></rect>
        <path class="draw house doorf" id="door" pathLength="1" d="M86 170 V128 H114 V170"></path>
      </svg>
    </div>

    <div class="wordmark" aria-label="GawaGo">
      <span class="ch" style="--d:2">G</span><span class="ch" style="--d:1">a</span><span class="ch" style="--d:0">w</span><span class="ch" style="--d:0">a</span><span class="ch go" style="--d:1">G</span><span class="ch go" style="--d:2">o</span>
    </div>
    <div class="tagline">Bawat gawa, <b>may kapares.</b></div>
    <div class="cta">
      <button class="start" id="startBtn">Get Started</button>
      <button class="replay" id="replayBtn">Replay intro</button>
    </div>
  </div>

  <div class="skip">Tap anywhere to skip</div>
</div>

<script>
(function () {
  var intro = document.getElementById('intro');
  var cv = document.getElementById('cv');
  var door = document.getElementById('door');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, pts = [];
  var TX = 0, TY = 0;            // meeting point = the house door
  var start = 0, raf = null, timers = [], finished = false;

  // timeline (ms)
  var T_LINES = 900;     // matching lines draw between households and workers
  var T_CONV = 2300;     // every pair travels to the door
  var T_MERGE = 3100;    // they meet and merge
  var T_HOUSE = 3150;    // the house draws around them
  var T_DOOR = 3950;     // door opens, house lights up
  var T_REVEAL = 4200;   // wordmark appears
  var T_END = 4500;      // canvas finished
  var T_DONE = 5700;     // CTA shown

  var CREAM = '245,241,230';
  var GREEN = '158,191,94';

  function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function clamp(x) { return Math.max(0, Math.min(1, x)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeIO(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

  function measureDoor() {
    var r = door.getBoundingClientRect();
    TX = r.left + r.width / 2;
    TY = r.top + r.height * 0.6;
  }

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
    measureDoor();
  }

  // pairs of household (cream) + worker (green) scattered around the screen
  function build() {
    var r = rng(11);
    var n = W < 600 ? 10 : 16;
    var R = Math.min(W, H) * 0.44;
    var m = 30;
    pts = [];
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + r() * 0.5;
      var d = R * (0.5 + 0.5 * r());
      var hx = W / 2 + Math.cos(a) * d * (W > H ? 1.45 : 1);
      var hy = H / 2 + Math.sin(a) * d * (W > H ? 0.85 : 1.2);
      var oa = r() * Math.PI * 2, od = 45 + r() * 70;
      var wx = hx + Math.cos(oa) * od, wy = hy + Math.sin(oa) * od;
      pts.push({
        hx: Math.max(m, Math.min(W - m, hx)), hy: Math.max(m, Math.min(H - m, hy)),
        wx: Math.max(m, Math.min(W - m, wx)), wy: Math.max(m, Math.min(H - m, wy)),
        ph: r() * 6.28, delay: r()
      });
    }
  }

  function dot(x, y, rad, rgb, alpha, glow) {
    if (rad <= 0 || alpha <= 0) return;
    if (glow) {
      ctx.beginPath(); ctx.arc(x, y, rad * 2.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + rgb + ',' + (0.16 * alpha) + ')'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + rgb + ',' + alpha + ')'; ctx.fill();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    var conv = easeIO(clamp((t - T_CONV) / (T_MERGE - T_CONV)));
    var merge = easeIO(clamp((t - T_MERGE) / 300));

    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var appear = clamp((t - p.delay * 700) / 400);
      var dx = Math.sin(t / 900 + p.ph) * 5, dy = Math.cos(t / 1100 + p.ph) * 5;
      var hx = lerp(p.hx + dx, TX - 8 * (1 - merge), conv);
      var hy = lerp(p.hy + dy, TY, conv);
      var wx = lerp(p.wx - dx, TX + 8 * (1 - merge), conv);
      var wy = lerp(p.wy - dy, TY, conv);

      // matching line + travelling pulse
      var ls = T_LINES + p.delay * 600;
      var lp = easeIO(clamp((t - ls) / 650));
      if (lp > 0) {
        var fade = 1 - conv;
        ctx.strokeStyle = 'rgba(' + GREEN + ',' + (0.5 * fade) + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(hx, hy);
        ctx.lineTo(lerp(hx, wx, lp), lerp(hy, wy, lp)); ctx.stroke();
        if (lp >= 1 && fade > 0) {
          var k = ((t - ls - 650) % 1100) / 1100;
          var pk = k < .5 ? k * 2 : 2 - k * 2;
          dot(lerp(hx, wx, pk), lerp(hy, wy, pk), 2.2, GREEN, 0.9 * fade, true);
        } else if (lp < 1) {
          dot(lerp(hx, wx, lp), lerp(hy, wy, lp), 2.6, GREEN, 1, true);
        }
      }

      var size = 4.5 * (1 - merge * 0.6);
      var a = appear * (1 - clamp((t - T_MERGE - 150) / 200));
      dot(hx, hy, size * appear, CREAM, a, false);
      dot(wx, wy, size * appear, GREEN, a, true);
    }

    // merged point waits at the door while the house is drawn, then becomes the door light
    if (t >= T_MERGE) {
      var fadeOut = 1 - clamp((t - T_DOOR) / 300);
      var breathe = 1 + Math.sin((t - T_MERGE) / 140) * 0.08;
      dot(TX, TY, (5 + merge * 4) * breathe * fadeOut, GREEN, fadeOut, true);

      var f = clamp((t - T_MERGE) / 700);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(' + GREEN + ',' + (0.8 * (1 - f)) + ')';
      ctx.beginPath(); ctx.arc(TX, TY, 10 + f * Math.min(W, H) * 0.35, 0, Math.PI * 2); ctx.stroke();
      var f2 = clamp((t - T_MERGE - 180) / 700);
      if (f2 > 0) {
        ctx.strokeStyle = 'rgba(' + GREEN + ',' + (0.5 * (1 - f2)) + ')';
        ctx.beginPath(); ctx.arc(TX, TY, 10 + f2 * Math.min(W, H) * 0.25, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  function loop(ts) {
    var t = ts - start;
    draw(t);
    if (t < T_END) raf = requestAnimationFrame(loop);
    else ctx.clearRect(0, 0, W, H);
  }

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearAll() {
    timers.forEach(clearTimeout); timers = [];
    if (raf) cancelAnimationFrame(raf); raf = null;
  }

  function finish() {
    clearAll();
    finished = true;
    ctx.clearRect(0, 0, W, H);
    intro.classList.add('fast', 'house-on', 'door-on', 'reveal', 'done');
  }

  function play() {
    clearAll();
    finished = false;
    intro.classList.remove('house-on', 'door-on', 'reveal', 'done', 'fast', 'leave', 'show-legend');
    void intro.offsetWidth;
    measureDoor();
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }
    start = performance.now();
    raf = requestAnimationFrame(loop);
    later(function () { intro.classList.add('show-legend'); }, 500);
    later(function () { intro.classList.add('house-on'); }, T_HOUSE);
    later(function () { intro.classList.add('door-on'); }, T_DOOR);
    later(function () { intro.classList.add('reveal'); }, T_REVEAL);
    later(function () { finished = true; intro.classList.add('done'); }, T_DONE);
  }

  intro.addEventListener('click', function (e) {
    if (e.target.closest('.cta')) return;
    if (!finished) finish();
  });
  document.getElementById('startBtn').addEventListener('click', function () { intro.classList.add('leave'); });
  document.getElementById('replayBtn').addEventListener('click', function (e) { e.stopPropagation(); play(); });
  window.addEventListener('resize', resize);

  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureDoor);
  play();
})();
</script>

</body>
</html>
